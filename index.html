<style>

body {
  opacity: 0;
  /* Start shifted 50 pixels to the right */
  transform: translateX(50px); 
  /* Smoothly transition both opacity and transform over 0.5 seconds */
  transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  /* Prevents horizontal scrollbars during the animation */
  overflow-x: hidden; 
}

body.loaded {
  opacity: 1;
  /* Slide back to its natural centered position */
  transform: translateX(0); 
}






</style>
