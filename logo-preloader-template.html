<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo preloader template</title>

<style>
/* ==========================================================================
   1. CONFIG — nearly everything you'll want to change lives here
   ========================================================================== */
:root{
  --ink:      #12161f;   /* page + curtain ground */
  --ink-2:    #1a2030;   /* curtain fill (slightly lifted so the edge reads) */
  --paper:    #e8ebf0;   /* primary text */
  --muted:    #7c8699;   /* secondary text */
  --signal:   #e8b33a;   /* accent — the logo stroke + CTA */
  --line:     #262d3d;   /* hairlines */

  --font-body: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;

  /* Motion. Keep these in sync with CFG in the script below. */
  --draw-ms:    950ms;   /* how long the logo takes to draw itself */
  --travel-ms: 1150ms;   /* logo flying from centre to header */
  --fade-ms:    600ms;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
/* Stop the page scrolling underneath the loader. Removed by JS on reveal. */
body.is-loading{overflow:hidden}


/* ==========================================================================
   2. PRELOADER — the full-screen curtain
   ========================================================================== */
#preloader{
  position:fixed; inset:0; z-index:9000;
  pointer-events:none;               /* never blocks clicks after it lifts */
}
#preloader .curtain{
  position:absolute; inset:0;
  width:100%; height:100%;
  display:block;
}
/* Optional: faint schematic grid on the curtain. Delete if you don't want it. */
#preloader .grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(var(--line) 0.5px, transparent 0.5px),
    linear-gradient(90deg, var(--line) 0.5px, transparent 0.5px);
  background-size:44px 44px;
  opacity:.5;
  transition:opacity var(--fade-ms) ease;
}
#preloader.is-leaving .grid{opacity:0}


/* ==========================================================================
   3. THE LOGO LOCKUP
   This is the trick: ONE element, cloned into a fixed-position layer.
   It starts scaled up in the middle of the screen and animates back to
   its own natural position in the header. No swap, no cross-fade.
   ========================================================================== */
.brand{
  display:flex; align-items:center; gap:11px;
  text-decoration:none; color:inherit;
}
.brand__mark{display:block; flex:none}
.brand__name{
  font-size:15px; font-weight:600; letter-spacing:.01em; line-height:1.15;
  white-space:nowrap;
}
.brand__sub{
  font-family:var(--font-mono);
  font-size:10px; letter-spacing:.22em; color:var(--signal);
  line-height:1.15; white-space:nowrap;
}

/* The flying copy */
#brand-lock{
  position:fixed; z-index:9100;
  transform-origin:left top;
  transition:transform var(--travel-ms) cubic-bezier(.65,0,.15,1);
  pointer-events:none;
}

/* The header copy, revealed only once the flying copy lands on top of it */
#logo-slot .brand{opacity:0}
#logo-slot.is-seated .brand{opacity:1}

/* --- self-drawing strokes ---
   pathLength="1" normalises every path to a length of 1, so one dash rule
   works no matter how long or complex the real geometry is. */
#brand-lock .brand__mark path{
  stroke-dasharray:1;
  stroke-dashoffset:1;
  transition:stroke-dashoffset var(--draw-ms) cubic-bezier(.5,0,.2,1);
}
#brand-lock.is-drawing .brand__mark path{stroke-dashoffset:0}
/* Stagger the strokes so the mark builds up rather than appearing at once. */
#brand-lock .brand__mark path:nth-child(2){transition-delay:.30s}
#brand-lock .brand__mark path:nth-child(3){transition-delay:.50s}

#brand-lock .brand__name,
#brand-lock .brand__sub{
  opacity:0; transform:translateX(-8px);
  transition:opacity var(--fade-ms) ease, transform var(--fade-ms) ease;
  transition-delay:.55s;
}
#brand-lock.is-drawing .brand__name,
#brand-lock.is-drawing .brand__sub{opacity:1; transform:none}


/* ==========================================================================
   4. CONTENT REVEAL — anything with [data-reveal] rises in, staggered
   ========================================================================== */
[data-reveal]{
  opacity:0; transform:translateY(20px);
  transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1);
}
[data-reveal].is-in{opacity:1; transform:none}


/* ==========================================================================
   5. DEMO PAGE — replace all of this with your real site
   ========================================================================== */
.site-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 34px;
}
.site-nav{display:flex; gap:26px; font-size:14px; color:var(--muted)}
.site-nav a{color:inherit; text-decoration:none}
.site-nav a:hover{color:var(--paper)}

.hero{padding:12vh 34px 0; max-width:760px}
.hero__eyebrow{
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:.22em; color:var(--signal);
  margin:0 0 18px;
}
.hero__title{
  font-size:clamp(34px, 6vw, 58px); font-weight:600;
  line-height:1.06; letter-spacing:-.02em; margin:0 0 20px;
}
.hero__body{
  font-size:17px; line-height:1.65; color:var(--muted);
  max-width:46ch; margin:0 0 32px;
}
.cta{
  display:inline-block; padding:13px 26px; border-radius:999px;
  background:var(--signal); color:var(--ink);
  font-size:15px; font-weight:600; text-decoration:none;
}


/* ==========================================================================
   6. ACCESSIBILITY — anyone who asked for less motion gets the page instantly
   ========================================================================== */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>

<body class="is-loading">

<!-- ---------------------------------------------------------------------
     PRELOADER MARKUP
     The path starts as a full-screen rectangle. JS morphs its bottom edge
     into a curve and retracts it upward.
     --------------------------------------------------------------------- -->
<div id="preloader" aria-hidden="true">
  <svg class="curtain" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="curtain-path" d="M0,0 H100 V100 C68,100 32,100 0,100 Z" fill="var(--ink-2)"/>
  </svg>
  <div class="grid"></div>
</div>


<!-- ---------------------------------------------------------------------
     YOUR SITE
     --------------------------------------------------------------------- -->
<header class="site-header">

  <!-- ===== SWAP YOUR LOGO IN HERE — this is the only copy you edit ===== -->
  <a class="brand" href="/" id="logo-slot">
    <svg class="brand__mark" width="40" height="40" viewBox="0 0 48 48"
         fill="none" stroke="var(--signal)" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" d="M24 3.5 L42 14 L42 34 L24 44.5 L6 34 L6 14 Z"/>
      <path pathLength="1" d="M18.5 17.5 L27.5 24 L18.5 30.5"/>
      <path pathLength="1" d="M31.5 30.5 L38 30.5"/>
    </svg>
    <span>
      <span class="brand__name">Baird</span><br>
      <span class="brand__sub">TECHNICAL</span>
    </span>
  </a>
  <!-- ================================================================== -->

  <nav class="site-nav">
    <a href="#">Work</a><a href="#">Services</a><a href="#">Contact</a>
  </nav>
</header>

<main class="hero">
  <p class="hero__eyebrow"  data-reveal>ADELAIDE, SOUTH AUSTRALIA</p>
  <h1 class="hero__title"   data-reveal>Built end to end, front to firmware</h1>
  <p class="hero__body"     data-reveal>Web apps, embedded hardware, networking and signage — designed, built and maintained by one person who answers the phone.</p>
  <p data-reveal><a class="cta" href="#">See the work</a></p>
</main>


<script>
(function () {
  'use strict';

  /* ======================================================================
     CONFIG — tune the feel here
     ====================================================================== */
  var CFG = {
    scale:        2.15,   // how big the logo starts, relative to header size
    drawDelay:     120,   // ms before the mark starts drawing
    minDuration:  1900,   // ms the loader is shown even on an instant load
    failsafe:     6000,   // ms after which we reveal regardless — never trap anyone
    curtainMs:    1050,   // curtain retract duration (JS-driven)
    curtainBulge:   20,   // 0 = flat edge, 30 = very liquid
    revealStart:   380,   // ms after reveal begins before content rises
    revealStagger: 120    // ms between each [data-reveal] element
  };

  var pre    = document.getElementById('preloader');
  var slot   = document.getElementById('logo-slot');
  var path   = document.getElementById('curtain-path');
  var items  = document.querySelectorAll('[data-reveal]');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lock, raf, done = false;

  /* ---------------------------------------------------------------------
     Reduced motion: no animation at all, just show the page.
     --------------------------------------------------------------------- */
  if (reduce) {
    finish();
    return;
  }

  /* ---------------------------------------------------------------------
     Clone the header logo into a fixed layer, sitting exactly on top of
     the original. Cloning means you only ever maintain one copy of the SVG.
     --------------------------------------------------------------------- */
  lock = slot.cloneNode(true);
  lock.id = 'brand-lock';
  lock.removeAttribute('href');
  document.body.appendChild(lock);

  /* Position the clone over the original, then work out the transform that
     throws it to the centre of the screen at CFG.scale. Because the clone
     already lives at its destination, "going home" is just transform:none. */
  function seat() {
    var r = slot.getBoundingClientRect();
    lock.style.left = r.left + 'px';
    lock.style.top  = r.top  + 'px';
  }
  function centreTransform() {
    var r  = lock.getBoundingClientRect();
    var dx = (innerWidth  - r.width  * CFG.scale) / 2 - r.left;
    var dy = (innerHeight - r.height * CFG.scale) / 2 - r.top;
    return 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + CFG.scale + ')';
  }
  function park() {
    lock.style.transition = 'none';       // measure and place with no animation
    lock.style.transform  = 'none';
    seat();
    lock.getBoundingClientRect();         // force reflow so the measurement is clean
    lock.style.transform  = centreTransform();
    lock.getBoundingClientRect();
    lock.style.transition = '';           // hand control back to the CSS transition
  }
  park();

  addEventListener('resize', function () { if (!done) park(); });

  /* Start drawing the mark. */
  setTimeout(function () { lock.classList.add('is-drawing'); }, CFG.drawDelay);

  /* ---------------------------------------------------------------------
     Curtain geometry.
     The bottom edge is one cubic curve. As the corners travel up, the two
     control points lag behind — that lag is what makes it look liquid.
     --------------------------------------------------------------------- */
  function curtainAt(e) {
    var corner = 100 - 100 * e;
    var ctrl   = corner + CFG.curtainBulge * Math.sin(Math.PI * e);
    return 'M0,0 H100 V' + corner.toFixed(2) +
           ' C68,' + ctrl.toFixed(2) + ' 32,' + ctrl.toFixed(2) +
           ' 0,'   + corner.toFixed(2) + ' Z';
  }
  function ease(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  /* ---------------------------------------------------------------------
     REVEAL — everything overlaps. Sequential phases feel slow.
     --------------------------------------------------------------------- */
  function reveal() {
    if (done) return;
    done = true;

    pre.classList.add('is-leaving');
    lock.style.transform = 'none';        // logo flies home

    var t0 = performance.now();
    (function step(now) {
      var t = Math.min((now - t0) / CFG.curtainMs, 1);
      path.setAttribute('d', curtainAt(ease(t)));
      if (t < 1) raf = requestAnimationFrame(step);
    })(performance.now());

    items.forEach(function (el, i) {
      setTimeout(function () { el.classList.add('is-in'); },
                 CFG.revealStart + i * CFG.revealStagger);
    });

    /* When the logo lands, show the real header logo and bin the clone.
       They're pixel-identical, so the handover is invisible. */
    lock.addEventListener('transitionend', function handoff(e) {
      if (e.propertyName !== 'transform') return;
      lock.removeEventListener('transitionend', handoff);
      slot.classList.add('is-seated');
      lock.remove();
      finish();
    });
  }

  function finish() {
    document.body.classList.remove('is-loading');
    slot.classList.add('is-seated');
    if (pre) pre.remove();
    cancelAnimationFrame(raf);
    items.forEach(function (el) { el.classList.add('is-in'); });
  }

  /* ---------------------------------------------------------------------
     WHEN to reveal: whichever comes later — the page being ready, or the
     minimum display time. Plus a hard ceiling so a stalled asset can never
     strand someone on the loading screen.
     --------------------------------------------------------------------- */
  var ready = new Promise(function (res) {
    if (document.readyState === 'complete') res();
    else addEventListener('load', res);
  });
  var minimum = new Promise(function (res) { setTimeout(res, CFG.minDuration); });

  Promise.all([ready, minimum]).then(reveal);
  setTimeout(reveal, CFG.failsafe);
})();
</script>
</body>
</html>
